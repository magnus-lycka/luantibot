# Config for the headless integration server. Never points at a real world.
name = lbtest
port = 30001
server_announce = false
enable_rollback_recording = false
enable_damage = false
creative_mode = true

# The mod under test must be authorised for outbound HTTP (M1.4 onward).
secure.http_mods = luantibot

luantibot_service_url = http://127.0.0.1:8099
luantibot_poll_interval = 1

# Keep the log terse; assertions are written to a result file, not scraped.
debug_log_level = action
