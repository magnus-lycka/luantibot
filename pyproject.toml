[project]
name = "luantibot"
version = "0.1.0"
description = "Compiles build intent into volumetric primitives for a Luanti builder mod"
readme = "README.md"
authors = [
    { name = "Magnus Lyckå", email = "magnus.lycka@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140.0",
    "httpx2>=2.9.1",
    "mcp>=1.28.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "deptry>=0.25.1",
    "hypothesis>=6.161.5",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Warnings are errors: deprecations from FastAPI/Starlette/Pydantic should be
# dealt with when they appear, not discovered during a major upgrade.
filterwarnings = ["error"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.deptry.per_rule_ignores]
# uvicorn is never imported by src/ -- it is invoked as a server by
# luantibot.service.__main__.
DEP002 = ["uvicorn"]
